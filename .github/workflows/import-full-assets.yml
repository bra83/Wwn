name: Import full WWN assets

on:
  push:
    paths:
      - '.github/workflows/import-full-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-full-wwn-assets
  cancel-in-progress: true

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fire-browser && cd /tmp/fire-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install chromium
      - name: Download full pack through firestorage share UI
        shell: bash
        env:
          SHARE_URL: https://firestorage.ai/ja/f/SYPvQq8bufW1
          EXPECTED_NAME: Braseiro_WWN_VERTICAL_SLICE_0.2.zip
        run: |
          set -euo pipefail
          cat >/tmp/fire-browser/download.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const url=process.env.SHARE_URL;
          const expected=process.env.EXPECTED_NAME;
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({acceptDownloads:true,locale:'ja-JP'});
          const page=await ctx.newPage();
          page.on('console',m=>console.log('BROWSER',m.text()));
          await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(2500);
          async function tryClick(loc,label){
            try{
              if(!await loc.isVisible({timeout:800})) return false;
              const dl=page.waitForEvent('download',{timeout:7000}).catch(()=>null);
              await loc.click({timeout:4000});
              const d=await dl;
              if(d){
                const name=d.suggestedFilename(); console.log('DOWNLOAD',label,name);
                await d.saveAs('/tmp/pack.zip'); return true;
              }
              await page.waitForTimeout(1300);
              return false;
            }catch(e){ console.log('CLICK_FAIL',label,String(e).slice(0,180)); return false; }
          }
          let ok=false;
          for(let round=0;round<5 && !ok;round++){
            console.log('ROUND',round,'URL',page.url(),'TITLE',await page.title());
            const direct=page.locator('a[download]');
            for(let i=0;i<Math.min(await direct.count(),12)&&!ok;i++) ok=await tryClick(direct.nth(i),'a[download]');
            if(ok)break;
            const filename=page.getByText(expected,{exact:false});
            if(await filename.count()){
              for(let i=0;i<Math.min(await filename.count(),5)&&!ok;i++) ok=await tryClick(filename.nth(i),'filename');
              if(ok)break;
            }
            const els=page.locator('a,button,[role="button"]');
            const n=Math.min(await els.count(),120);
            let candidates=[];
            for(let i=0;i<n;i++){
              const e=els.nth(i);
              let txt='',href='',aria='';
              try{txt=(await e.innerText()).trim();}catch{}
              try{href=await e.getAttribute('href')||'';}catch{}
              try{aria=await e.getAttribute('aria-label')||'';}catch{}
              const s=`${txt} ${href} ${aria}`;
              if(/download|ダウンロード|保存|受け取|ファイル|file|zip|braseiro/i.test(s)) candidates.push([i,s.slice(0,180)]);
            }
            console.log('CANDIDATES',JSON.stringify(candidates.slice(0,30)));
            for(const [i,s] of candidates){ if(await tryClick(els.nth(i),s)){ok=true;break;} }
            if(ok)break;
            // Some share pages expose the actual file only after a generic primary action.
            const generic=page.locator('button,[role="button"]');
            for(let i=0;i<Math.min(await generic.count(),25)&&!ok;i++){
              const e=generic.nth(i); let t='';try{t=(await e.innerText()).trim()}catch{}
              if(t && !/delete|削除|login|ログイン/i.test(t)){
                if(await tryClick(e,`generic:${t.slice(0,60)}`)){ok=true;break;}
              }
            }
          }
          if(!ok || !fs.existsSync('/tmp/pack.zip')){
            console.log('FINAL_HTML', (await page.locator('body').innerText()).slice(0,5000));
            await browser.close(); process.exit(22);
          }
          const st=fs.statSync('/tmp/pack.zip'); console.log('ZIP_BYTES',st.size);
          await browser.close();
          JS
          cd /tmp/fire-browser
          node download.mjs
          test -s /tmp/pack.zip
          unzip -t /tmp/pack.zip >/tmp/unzip-test.txt
          tail -n 3 /tmp/unzip-test.txt
      - name: Import binary assets and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/full && mkdir -p /tmp/full
          unzip -q /tmp/pack.zip -d /tmp/full
          mkdir -p assets
          cp -f /tmp/full/assets/*.png assets/
          count=$(find assets -maxdepth 1 -type f -name '*.png' | wc -l)
          echo "PNG_COUNT=$count"
          test "$count" -ge 80
          test -f assets/terrain_base_16_rocky_highland.png
          test -f assets/terrain_features_10_inland_sea.png
          test -f assets/terrain_features_04_high_mountains.png
          test -f assets/weather_time_07_fog.png
          test -f assets/poi_inhabited_04_dense_city.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          if git diff --cached --quiet; then
            echo 'Assets already complete.'
          else
            git commit -m 'Import complete WWN terrain feature POI and weather asset library'
            git push
          fi
