name: Deploy Braseiro WWN to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate WWN app and runtime assets
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s world.css
          test -s world.js
          node --check world.js
          grep -q 'world.css?v=' index.html
          grep -q 'world.js?v=' index.html
          grep -q 'function enterPOI' world.js
          grep -q 'function exportWorld' world.js
          grep -q 'wwn_world_engine_v4' world.js
          grep -q 'background:center/230% auto' world.css
          test -s assets/terrain_base_01_lush_grassland.png
          test -s assets/terrain_base_10_dark_swamp.png
          test -s assets/terrain_base_14_snowfield.png
          test -s assets/terrain_features_04_high_mountains.png
          test -s assets/terrain_features_10_inland_sea.png
          test -s assets/terrain_features_14_island.png
          test -s assets/poi_inhabited_02_farming_village.png
          test -s assets/poi_dangerous_01_overgrown_ruins.png
          test -s assets/weather_time_07_fog.png
          test -s assets/weather_time_16_night_moon.png

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test public Pages site
        shell: bash
        run: |
          set -euo pipefail
          site='${{ steps.deployment.outputs.page_url }}'
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsSL --retry 2 "$site" -o /tmp/live-index.html && grep -q 'WORLD WITHOUT NUMBER' /tmp/live-index.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          curl -fsSL "${site}world.js" -o /tmp/live-world.js
          curl -fsSL "${site}world.css" -o /tmp/live-world.css
          node --check /tmp/live-world.js
          grep -q 'function enterPOI' /tmp/live-world.js
          grep -q 'wwn_world_engine_v4' /tmp/live-world.js
          grep -q 'background:center/230% auto' /tmp/live-world.css
          for asset in \
            assets/terrain_base_10_dark_swamp.png \
            assets/terrain_features_04_high_mountains.png \
            assets/terrain_features_10_inland_sea.png \
            assets/poi_inhabited_02_farming_village.png \
            assets/poi_dangerous_01_overgrown_ruins.png \
            assets/weather_time_07_fog.png; do
            curl -fsSL "${site}${asset}" -o /tmp/check.bin
            test -s /tmp/check.bin
          done
          echo "PUBLIC_URL=$site"
