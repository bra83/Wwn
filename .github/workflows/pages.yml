name: Deploy Braseiro WWN to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build integrated WWN runtime v11
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's/Hex-Crawl/Exploração Hex/g' index.html
          sed -i 's/Hexcrawl e exploração/Exploração por hex/g' index.html
          sed -i 's/Tempo \/ névoa/Tempo \/ clima/g' index.html

          sed -Ei 's/world-v5\.css\?v=[0-9]+/world-v5.css?v=21/g' index.html
          sed -Ei 's/world-v5\.js\?v=[0-9]+/world-v5.js?v=21/g' index.html
          sed -Ei 's/app-v6\.css\?v=[0-9]+/app-v6.css?v=21/g' index.html
          sed -Ei 's/app-v6\.js\?v=[0-9]+/app-v6.js?v=21/g' index.html

          # No-fog baseline: unknown hexes stay black with a gold question mark.
          sed -i "/@import url('fog-v7.css?v=1');/d" world-v5.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('world-v5.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("let wwnLayers=Object.assign({features:true,pois:true,mist:true,labels:true}", "let wwnLayers=Object.assign({features:true,pois:true,mist:false,labels:true}")
          s=s.replace("map.classList.toggle('hide-mist',!wwnLayers.mist);", "map.classList.add('hide-mist');")
          s=s.replace("<div class=\"layer mist\"></div>", "")
          s=s.replace("['mist','Neblina','Fog contextual de terreno e clima'],", "")
          s=s.replace("'Sem feature'", "'Sem relevo'")
          s=s.replace("<span>Feature</span>", "<span>Relevo</span>")
          s=s.replace("Terreno, feature ou local...", "Terreno, relevo ou local...")
          s=s.replace("ou outras features", "ou outros relevos")
          p.write_text(s,encoding='utf-8')
          PY

          # Inject dark Atlas, sparse POIs and integrated game runtimes.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def css(name,version):
              global s
              if name not in s:
                  s=s.replace('</head>', f'<link rel="stylesheet" href="{name}?v={version}"></head>')
              else:
                  s=re.sub(re.escape(name)+r'\?v=\d+', f'{name}?v={version}', s)
          def js(name,version):
              global s
              if name not in s:
                  s=s.replace('</body>', f'<script src="{name}?v={version}"></script></body>')
              else:
                  s=re.sub(re.escape(name)+r'\?v=\d+', f'{name}?v={version}', s)
          css('atlas-dark-poi.css',21)
          css('game-v7.css',21)
          css('game-v8.css',21)
          css('game-v9.css',21)
          css('game-v10.css',21)
          css('game-v11.css',21)
          js('atlas-poi-seed.js',21)
          js('game-v7.js',21)
          js('game-v8.js',21)
          js('game-v9.js',21)
          js('game-v10.js',21)
          js('game-v11.js',21)
          p.write_text(s,encoding='utf-8')
          PY

          cat >> atlas-dark-poi.css <<'CSS'

          /* ATLAS_LABEL_STACK_V21 */
          .map-weather,.hex .mist,.hex .fog-unknown{display:none!important;opacity:0!important;background:none!important;background-image:none!important}
          .hex:not(.seen){background:#000!important}
          .hex:not(.seen) .shade{background:#000!important;opacity:1!important}
          .hex:not(.seen) .mark{display:block!important;color:#d9b26a!important;text-shadow:0 0 8px rgba(217,178,106,.3),0 2px 5px #000!important}
          .poi-label-overlay{z-index:120!important;overflow:visible!important;pointer-events:none!important}
          .poi-label-float{z-index:121!important;pointer-events:none!important}
          CSS

      - name: Validate integrated production build
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html world.css world.js world-v5.css world-v5.js app-v6.css app-v6.js atlas-dark-poi.css atlas-poi-seed.js game-v7.css game-v7.js game-v8.css game-v8.js game-v9.css game-v9.js game-v10.css game-v10.js game-v11.css game-v11.js assets/ui-icons.svg; do test -s "$file"; done
          node --check world.js
          node --check world-v5.js
          node --check app-v6.js
          node --check atlas-poi-seed.js
          node --check game-v7.js
          node --check game-v8.js
          node --check game-v9.js
          node --check game-v10.js
          node --check game-v11.js
          grep -q 'Exploração Hex' index.html
          grep -q 'atlas-dark-poi.css?v=21' index.html
          grep -q 'atlas-poi-seed.js?v=21' index.html
          grep -q 'game-v7.css?v=21' index.html
          grep -q 'game-v7.js?v=21' index.html
          grep -q 'game-v8.css?v=21' index.html
          grep -q 'game-v8.js?v=21' index.html
          grep -q 'game-v9.css?v=21' index.html
          grep -q 'game-v9.js?v=21' index.html
          grep -q 'game-v10.css?v=21' index.html
          grep -q 'game-v10.js?v=21' index.html
          grep -q 'game-v11.css?v=21' index.html
          grep -q 'game-v11.js?v=21' index.html
          grep -q 'ATLAS_DARK_POI_V14' atlas-dark-poi.css
          grep -q 'ATLAS_LABEL_STACK_V21' atlas-dark-poi.css
          grep -q 'ATLAS_POI_SEED_V15' atlas-poi-seed.js
          grep -q 'GAME_RUNTIME_V7' game-v7.js
          grep -q 'GAME_RUNTIME_V8' game-v8.js
          grep -q 'GAME_RUNTIME_V9' game-v9.js
          grep -q 'GAME_RUNTIME_V10' game-v10.js
          grep -q 'GAME_RUNTIME_V11' game-v11.js
          grep -q 'game8GenerateEncounter' game-v8.js
          grep -q 'game8Autosave' game-v8.js
          grep -q 'game8UpdateQuests' game-v8.js
          grep -q 'game9Compose' game-v9.js
          grep -q 'game9Act' game-v9.js
          grep -q 'game9RouteAction' game-v9.js
          grep -q 'game10Intent' game-v10.js
          grep -q 'game10Submit' game-v10.js
          grep -q 'gemini11Generate' game-v11.js
          grep -q 'x-goog-api-key' game-v11.js
          grep -q 'gemini-3.8-flash' game-v11.js
          grep -q 'poi-label-overlay' game-v8.css
          ! grep -q "@import url('fog-v7.css" world-v5.css
          ! grep -q 'fog-boundary-v8.css' index.html
          ! grep -q 'fog-boundary-v8.js' index.html
          test -s assets/poi_inhabited_02_farming_village.png
          test -s assets/poi_inhabited_15_stone_bridge.png
          test -s assets/poi_dangerous_12_abandoned_settlement.png

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test public Pages site
        shell: bash
        run: |
          set -euo pipefail
          site='${{ steps.deployment.outputs.page_url }}'
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsSL --retry 2 "$site" -o /tmp/live-index.html && grep -q 'game-v11.js?v=21' /tmp/live-index.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          grep -q 'game-v11.css?v=21' /tmp/live-index.html
          grep -q 'game-v10.js?v=21' /tmp/live-index.html
          curl -fsSL "${site}game-v11.js?v=21" -o /tmp/live-game11.js
          curl -fsSL "${site}game-v11.css?v=21" -o /tmp/live-game11.css
          curl -fsSL "${site}atlas-dark-poi.css?v=21" -o /tmp/live-dark.css
          node --check /tmp/live-game11.js
          grep -q 'GAME_RUNTIME_V11' /tmp/live-game11.js
          grep -q 'gemini11Generate' /tmp/live-game11.js
          grep -q 'x-goog-api-key' /tmp/live-game11.js
          grep -q 'game11-card' /tmp/live-game11.css
          grep -q 'ATLAS_LABEL_STACK_V21' /tmp/live-dark.css
          ! grep -q "@import url('fog-v7.css" /tmp/live-dark.css
          for asset in assets/poi_inhabited_02_farming_village.png assets/poi_inhabited_15_stone_bridge.png assets/poi_dangerous_12_abandoned_settlement.png; do curl -fsSL "${site}${asset}" -o /tmp/check.bin; test -s /tmp/check.bin; done
          echo "PUBLIC_URL=$site"
