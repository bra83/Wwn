name: Deploy Braseiro WWN to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve firestorage runtime package
        shell: bash
        run: |
          set -euo pipefail
          share='https://firestorage.ai/ja/f/PJmIjMoXk-LZ'
          curl -L --fail --silent --show-error -A 'Mozilla/5.0' -D /tmp/fire.headers "$share" -o /tmp/fire.body
          echo '=== RESPONSE HEADERS ==='
          cat /tmp/fire.headers
          echo '=== BODY TYPE/SIZE ==='
          file /tmp/fire.body || true
          wc -c /tmp/fire.body

          if unzip -tqq /tmp/fire.body >/dev/null 2>&1; then
            mv /tmp/fire.body /tmp/runtime.zip
          else
            echo '=== FIRESTORAGE PAGE URL CANDIDATES ==='
            python3 - <<'PY'
          import html, re
          from pathlib import Path
          s = html.unescape(Path('/tmp/fire.body').read_text('utf-8', errors='ignore'))
          vals = []
          vals += re.findall(r'https?://[^\s"\'<>]+', s)
          vals += re.findall(r'(?:href|src)=["\']([^"\']+)', s, flags=re.I)
          seen=[]
          for v in vals:
              if v not in seen and any(k in v.lower() for k in ('download','file','api','zip','pjmijmoxk-lz','wc5bv1f36zcbluv')):
                  seen.append(v)
          for v in seen[:200]:
              print(v)
          PY
            echo '=== FIRESTORAGE PAGE EXCERPT ==='
            head -c 12000 /tmp/fire.body | sed 's/></>\n</g' | head -n 200
            exit 42
          fi

          echo 'c6da2f1f6c0980235f0fc9f7b76cd45e58aaf080a21f605df776e7ad086116b3  /tmp/runtime.zip' | sha256sum -c -
          rm -rf assets
          unzip -q /tmp/runtime.zip -d .
          test -f assets/terrain_base_01_lush_grassland.png
          test -f assets/terrain_base_08_humid_jungle.png

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
