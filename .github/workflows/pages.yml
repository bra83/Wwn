name: Deploy Braseiro WWN to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover exact firestorage download endpoint
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.firestorage.ai/dev/file'
          share='PJmIjMoXk-LZ'
          curl -L --fail --silent --show-error "$api/shares/$share/files?maxResults=1000" -o /tmp/list.json
          echo '=== FILE LIST ==='
          cat /tmp/list.json
          echo
          curl -L --fail --silent --show-error 'https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js' -o /tmp/fire.js
          echo '=== DOWNLOADURL CONTEXT ==='
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/fire.js').read_text('utf-8',errors='ignore')
          for needle in ('downloadUrl','download-url','/download','downloads'):
              print('\n###', needle)
              pos=0
              for n in range(20):
                  i=s.find(needle,pos)
                  if i<0: break
                  print(s[max(0,i-1200):min(len(s),i+1200)])
                  pos=i+len(needle)
          PY
          exit 45

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
