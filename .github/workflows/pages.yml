name: Deploy Braseiro WWN to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build integrated WWN runtime v31
        shell: bash
        run: |
          set -euo pipefail
          VERSION=39

          sed -i 's/Hex-Crawl/Exploração Hex/g' index.html
          sed -i 's/Hexcrawl e exploração/Exploração por hex/g' index.html
          sed -i 's/Tempo \/ névoa/Tempo \/ clima/g' index.html
          sed -Ei "s/world-v5\.css\?v=[0-9]+/world-v5.css?v=${VERSION}/g" index.html
          sed -Ei "s/world-v5\.js\?v=[0-9]+/world-v5.js?v=${VERSION}/g" index.html
          sed -Ei "s/app-v6\.css\?v=[0-9]+/app-v6.css?v=${VERSION}/g" index.html
          sed -Ei "s/app-v6\.js\?v=[0-9]+/app-v6.js?v=${VERSION}/g" index.html

          sed -i "/@import url('fog-v7.css?v=1');/d" world-v5.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('world-v5.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("let wwnLayers=Object.assign({features:true,pois:true,mist:true,labels:true}", "let wwnLayers=Object.assign({features:true,pois:true,mist:false,labels:true}")
          s=s.replace("map.classList.toggle('hide-mist',!wwnLayers.mist);", "map.classList.add('hide-mist');")
          s=s.replace("<div class=\"layer mist\"></div>", "")
          s=s.replace("['mist','Neblina','Fog contextual de terreno e clima'],", "")
          s=s.replace("'Sem feature'", "'Sem relevo'")
          s=s.replace("<span>Feature</span>", "<span>Relevo</span>")
          s=s.replace("Terreno, feature ou local...", "Terreno, relevo ou local...")
          s=s.replace("ou outras features", "ou outros relevos")
          p.write_text(s,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          VERSION=39
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css_names=['atlas-dark-poi.css']+[f'game-v{i}.css' for i in range(7,28)]
          js_names=['atlas-poi-seed.js','game-v7.js','game-v8.js','game-v9.js','game-v10.js','gemini-narrative-v11.js']+[f'game-v{i}.js' for i in range(12,32)]
          for name in css_names:
              if name in s:
                  s=re.sub(re.escape(name)+r'\?v=\d+',f'{name}?v={VERSION}',s)
              else:
                  s=s.replace('</head>',f'<link rel="stylesheet" href="{name}?v={VERSION}"></head>')
          for name in js_names:
              if name in s:
                  s=re.sub(re.escape(name)+r'\?v=\d+',f'{name}?v={VERSION}',s)
              else:
                  s=s.replace('</body>',f'<script src="{name}?v={VERSION}"></script></body>')
          p.write_text(s,encoding='utf-8')
          PY

          cat >> atlas-dark-poi.css <<'CSS'

          /* ATLAS_LABEL_STACK_V39 */
          .map-weather,.hex .mist,.hex .fog-unknown{display:none!important;opacity:0!important;background:none!important;background-image:none!important}
          .hex:not(.seen){background:#000!important}
          .hex:not(.seen) .shade{background:#000!important;opacity:1!important}
          .hex:not(.seen) .mark{display:block!important;color:#d9b26a!important;text-shadow:0 0 8px rgba(217,178,106,.3),0 2px 5px #000!important}
          .poi-label-overlay{z-index:120!important;overflow:visible!important;pointer-events:none!important}
          .poi-label-float{z-index:121!important;pointer-events:none!important}
          CSS

      - name: Validate integrated production build
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html world.js world-v5.js app-v6.js atlas-poi-seed.js gemini-narrative-v11.js game-v26.css game-v26.js game-v27.css game-v27.js game-v28.js game-v29.js game-v30.js game-v31.js; do test -s "$file"; done
          node --check world.js
          node --check world-v5.js
          node --check app-v6.js
          node --check atlas-poi-seed.js
          node --check gemini-narrative-v11.js
          for i in $(seq 7 10) $(seq 12 31); do node --check "game-v${i}.js"; done
          grep -q 'game-v27.css?v=39' index.html
          grep -q 'game-v31.js?v=39' index.html
          grep -q 'game-v30.js?v=39' index.html
          grep -q 'game-v29.js?v=39' index.html
          grep -q 'game-v28.js?v=39' index.html
          grep -q 'gemini-narrative-v11.js?v=39' index.html
          grep -q 'GAME_RUNTIME_V28' game-v28.js
          grep -q 'WWN_ENGINE' game-v28.js
          grep -q 'GAME_RUNTIME_V29' game-v29.js
          grep -q 'WWN_WORLD' game-v29.js
          grep -q 'GAME_RUNTIME_V30' game-v30.js
          grep -q 'WWN_DIRECTOR' game-v30.js
          grep -q 'GAME_RUNTIME_V31' game-v31.js
          grep -q 'game31RunStress' game-v31.js
          grep -q 'ATLAS_LABEL_STACK_V39' atlas-dark-poi.css
          ! grep -q "@import url('fog-v7.css" world-v5.css
          ! grep -q 'fog-boundary-v8.css' index.html
          ! grep -q 'fog-boundary-v8.js' index.html
          curl -fsSL 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs' -o /tmp/pdf.min.mjs
          test -s /tmp/pdf.min.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test public Pages site
        shell: bash
        run: |
          set -euo pipefail
          site='${{ steps.deployment.outputs.page_url }}'
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsSL --retry 2 "$site" -o /tmp/live-index.html && grep -q 'game-v31.js?v=39' /tmp/live-index.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          grep -q 'game-v27.css?v=39' /tmp/live-index.html
          for i in 28 29 30 31; do
            curl -fsSL "${site}game-v${i}.js?v=39" -o "/tmp/live-game${i}.js"
            node --check "/tmp/live-game${i}.js"
            grep -q "GAME_RUNTIME_V${i}" "/tmp/live-game${i}.js"
          done
          grep -q 'WWN_ENGINE' /tmp/live-game28.js
          grep -q 'WWN_WORLD' /tmp/live-game29.js
          grep -q 'WWN_DIRECTOR' /tmp/live-game30.js
          grep -q 'game31RunStress' /tmp/live-game31.js
          echo "PUBLIC_URL=$site"
