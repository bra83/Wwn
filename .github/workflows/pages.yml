name: Deploy Braseiro WWN to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Atlas frontier mist V9
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'fog-boundary-v8.css' index.html || sed -i 's#</head>#<link rel="stylesheet" href="fog-boundary-v8.css?v=2"></head>#' index.html
          grep -q 'fog-boundary-v8.js' index.html || sed -i 's#</body>#<script src="fog-boundary-v8.js?v=2"></script></body>#' index.html

      - name: Validate WWN app and runtime assets
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html world.css world.js world-v5.css world-v5.js app-v6.css app-v6.js fog-boundary-v8.css fog-boundary-v8.js assets/ui-icons.svg assets/fog_frontier_mist_v9.svg; do test -s "$file"; done
          node --check world.js
          node --check world-v5.js
          node --check app-v6.js
          node --check fog-boundary-v8.js
          grep -q 'fog-boundary-v8.css?v=2' index.html
          grep -q 'fog-boundary-v8.js?v=2' index.html
          grep -q 'id="inicio"' index.html
          grep -q 'id="personagem"' index.html
          grep -q 'id="explorar"' index.html
          grep -q 'id="confronto"' index.html
          grep -q 'id="mestre"' index.html
          grep -q 'function wwnTravelSelected' world-v5.js
          grep -q 'function oracleRoll' app-v6.js
          grep -q 'renderFrontierFogV8' fog-boundary-v8.js
          grep -q 'fog_frontier_mist_v9.svg' fog-boundary-v8.css
          grep -q 'background:#000!important' fog-boundary-v8.css
          grep -q 'frontier-fog-layer' fog-boundary-v8.css
          grep -q 'width:142px!important' fog-boundary-v8.css
          grep -q "'Feature','Relevo'" fog-boundary-v8.js
          grep -q "'Main Action','Ação principal'" fog-boundary-v8.js
          grep -q 'symbol id="compass"' assets/ui-icons.svg
          test -s assets/terrain_features_04_high_mountains.png
          test -s assets/terrain_features_09_freshwater_lake.png
          test -s assets/poi_inhabited_16_crossroads_inn.png
          test -s assets/poi_inhabited_15_stone_bridge.png

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test public Pages site
        shell: bash
        run: |
          set -euo pipefail
          site='${{ steps.deployment.outputs.page_url }}'
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsSL --retry 2 "$site" -o /tmp/live-index.html && grep -q 'fog-boundary-v8.js?v=2' /tmp/live-index.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          grep -q 'fog-boundary-v8.css?v=2' /tmp/live-index.html
          curl -fsSL "${site}fog-boundary-v8.js?v=2" -o /tmp/live-fog-v8.js
          curl -fsSL "${site}fog-boundary-v8.css?v=2" -o /tmp/live-fog-v8.css
          curl -fsSL "${site}assets/fog_frontier_mist_v9.svg" -o /tmp/live-mist.svg
          curl -fsSL "${site}world-v5.js" -o /tmp/live-v5.js
          curl -fsSL "${site}app-v6.js" -o /tmp/live-app.js
          node --check /tmp/live-fog-v8.js
          node --check /tmp/live-v5.js
          node --check /tmp/live-app.js
          grep -q 'renderFrontierFogV8' /tmp/live-fog-v8.js
          grep -q 'fog_frontier_mist_v9.svg' /tmp/live-fog-v8.css
          grep -q 'frontier-fog-layer' /tmp/live-fog-v8.css
          grep -q 'width:142px!important' /tmp/live-fog-v8.css
          grep -q '<feTurbulence' /tmp/live-mist.svg
          grep -q "'Feature','Relevo'" /tmp/live-fog-v8.js
          for asset in assets/terrain_features_04_high_mountains.png assets/terrain_features_09_freshwater_lake.png assets/poi_inhabited_16_crossroads_inn.png assets/poi_inhabited_15_stone_bridge.png; do curl -fsSL "${site}${asset}" -o /tmp/check.bin; test -s /tmp/check.bin; done
          echo "PUBLIC_URL=$site"
