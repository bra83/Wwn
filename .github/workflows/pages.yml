name: Deploy Braseiro WWN to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect firestorage client chunks
        shell: bash
        run: |
          set -euo pipefail
          base='https://firestorage.ai'
          mkdir -p /tmp/chunks
          paths=(
            '/_next/static/chunks/4bd1b696-93bf506b236d6248.js'
            '/_next/static/chunks/3794-56f19dc9e2f95fcd.js'
            '/_next/static/chunks/main-app-7107f99dce0bf1eb.js'
            '/_next/static/chunks/8500-f4d7bfbe7500f274.js'
            '/_next/static/chunks/8437-d65cc193dc908afa.js'
            '/_next/static/chunks/5841-1160578ba9bb4f3e.js'
            '/_next/static/chunks/4899-d89df949f2dbd5af.js'
            '/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js'
          )
          i=0
          for p in "${paths[@]}"; do
            i=$((i+1))
            out="/tmp/chunks/$i.js"
            curl -L --fail --silent --show-error -A 'Mozilla/5.0' "$base$p" -o "$out"
            printf '%s %s bytes %s\n' "$i" "$(wc -c < "$out")" "$p"
          done
          echo '=== ROUTE STUB ==='
          cat /tmp/chunks/8.js
          echo
          echo '=== RELEVANT STRINGS ==='
          python3 - <<'PY'
          import re
          from pathlib import Path
          for f in sorted(Path('/tmp/chunks').glob('*.js')):
              s=f.read_text('utf-8',errors='ignore')
              print('---',f.name,'---')
              needles=('download','shareid','publicid','/api/','presign','signed','object','folder','password')
              for needle in needles:
                  pos=0; n=0
                  low=s.lower()
                  while True:
                      i=low.find(needle,pos)
                      if i<0: break
                      a=max(0,i-220); b=min(len(s),i+420)
                      text=s[a:b].replace('\n',' ')
                      print(text)
                      n+=1; pos=i+len(needle)
                      if n>=12: break
          PY
          exit 44

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
