name: Deploy Braseiro WWN to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect firestorage download client
        shell: bash
        run: |
          set -euo pipefail
          base='https://firestorage.ai'
          js='/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js'
          curl -L --fail --silent --show-error -A 'Mozilla/5.0' "$base$js" -o /tmp/fire.js
          echo '=== JS SIZE ==='
          wc -c /tmp/fire.js
          echo '=== API/DOWNLOAD STRING CANDIDATES ==='
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/fire.js').read_text('utf-8',errors='ignore')
          pats=[
            r'https?://[^"\'`\\ ]+',
            r'/api/[^"\'`\\ ]+',
            r'[^"\'`\\ ]{0,120}download[^"\'`\\ ]{0,180}',
            r'[^"\'`\\ ]{0,120}share[^"\'`\\ ]{0,180}',
            r'[^"\'`\\ ]{0,120}publicId[^"\'`\\ ]{0,180}',
            r'[^"\'`\\ ]{0,120}shareId[^"\'`\\ ]{0,180}',
          ]
          seen=[]
          for pat in pats:
            for m in re.findall(pat,s,flags=re.I):
              if m not in seen:
                seen.append(m)
          for x in seen[:300]: print(x)
          PY
          echo '=== FETCH CALLS ==='
          grep -oE '.{0,180}(fetch\(|axios|XMLHttpRequest).{0,260}' /tmp/fire.js | head -n 100 || true
          exit 43

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
