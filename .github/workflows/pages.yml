name: Deploy Braseiro WWN to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore exact runtime assets from approved preview
        shell: bash
        run: |
          set -euo pipefail
          base="https://braseiro-wwn-vertical-slice.chimeraloja.chatgpt.site/assets"
          mkdir -p assets
          for f in \
            terrain_base_01_lush_grassland.png \
            terrain_base_02_dry_grassland.png \
            terrain_base_03_cultivated_farmland.png \
            terrain_base_04_wild_meadow.png \
            terrain_base_05_scrubland.png \
            terrain_base_06_deciduous_forest.png \
            terrain_base_07_dense_pine_forest.png \
            terrain_base_08_humid_jungle.png; do
            curl --fail --location --retry 2 --silent --show-error "$base/$f" -o "assets/$f"
          done
          cat > /tmp/asset-sha256.txt <<'EOF'
          0f4dd6d2b08a2174ad3d1c3ad1d32564d2d73a23373ba6ff8b4ca0b00ae232d6  assets/terrain_base_01_lush_grassland.png
          fbf0dd09d30823edbe077504e97226e3b379112b7e980198a511a56b2b69c007  assets/terrain_base_02_dry_grassland.png
          2550045ca348d63070497a3210f3ee3677abb411eea549a6793aae4d601db0b8  assets/terrain_base_03_cultivated_farmland.png
          341f63c382f087784598af05e0e3908bae9843f6bc233b7aff37d0dc8e347305  assets/terrain_base_04_wild_meadow.png
          9d4444c0803da091885fa5df87934fe2863e3b2c956ea0c5f26db31287fef411  assets/terrain_base_05_scrubland.png
          e53563b57009c6882e294dfa523a36fc6831554526ccc49a95e198814fdf8a6e  assets/terrain_base_06_deciduous_forest.png
          23fa3c9b5e0fd8277063bafcdb609dea48b851087742adf90ee5b2766e04e288  assets/terrain_base_07_dense_pine_forest.png
          c34f8258ebbda766aac79822c94166d697d741f0ba23503d7f3f4e7061673815  assets/terrain_base_08_humid_jungle.png
          EOF
          sha256sum -c /tmp/asset-sha256.txt
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
