name: Deploy Braseiro WWN to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build integrated WWN runtime v25
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's/Hex-Crawl/Exploração Hex/g' index.html
          sed -i 's/Hexcrawl e exploração/Exploração por hex/g' index.html
          sed -i 's/Tempo \/ névoa/Tempo \/ clima/g' index.html

          sed -Ei 's/world-v5\.css\?v=[0-9]+/world-v5.css?v=36/g' index.html
          sed -Ei 's/world-v5\.js\?v=[0-9]+/world-v5.js?v=36/g' index.html
          sed -Ei 's/app-v6\.css\?v=[0-9]+/app-v6.css?v=36/g' index.html
          sed -Ei 's/app-v6\.js\?v=[0-9]+/app-v6.js?v=36/g' index.html

          sed -i "/@import url('fog-v7.css?v=1');/d" world-v5.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('world-v5.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("let wwnLayers=Object.assign({features:true,pois:true,mist:true,labels:true}", "let wwnLayers=Object.assign({features:true,pois:true,mist:false,labels:true}")
          s=s.replace("map.classList.toggle('hide-mist',!wwnLayers.mist);", "map.classList.add('hide-mist');")
          s=s.replace("<div class=\"layer mist\"></div>", "")
          s=s.replace("['mist','Neblina','Fog contextual de terreno e clima'],", "")
          s=s.replace("'Sem feature'", "'Sem relevo'")
          s=s.replace("<span>Feature</span>", "<span>Relevo</span>")
          s=s.replace("Terreno, feature ou local...", "Terreno, relevo ou local...")
          s=s.replace("ou outras features", "ou outros relevos")
          p.write_text(s,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def css(name,version):
              global s
              if name not in s:
                  s=s.replace('</head>', f'<link rel="stylesheet" href="{name}?v={version}"></head>')
              else:
                  s=re.sub(re.escape(name)+r'\?v=\d+', f'{name}?v={version}', s)
          def js(name,version):
              global s
              if name not in s:
                  s=s.replace('</body>', f'<script src="{name}?v={version}"></script></body>')
              else:
                  s=re.sub(re.escape(name)+r'\?v=\d+', f'{name}?v={version}', s)
          css_names=['atlas-dark-poi.css','game-v7.css','game-v8.css','game-v9.css','game-v10.css','game-v11.css','game-v12.css','game-v13.css','game-v14.css','game-v15.css','game-v16.css','game-v17.css','game-v18.css','game-v19.css','game-v20.css','game-v21.css','game-v22.css','game-v23.css','game-v24.css','game-v25.css']
          js_names=['atlas-poi-seed.js','game-v7.js','game-v8.js','game-v9.js','game-v10.js','gemini-narrative-v11.js','game-v12.js','game-v13.js','game-v14.js','game-v15.js','game-v16.js','game-v17.js','game-v18.js','game-v19.js','game-v20.js','game-v21.js','game-v22.js','game-v23.js','game-v24.js','game-v25.js']
          for name in css_names: css(name,36)
          for name in js_names: js(name,36)
          p.write_text(s,encoding='utf-8')
          PY

          cat >> atlas-dark-poi.css <<'CSS'

          /* ATLAS_LABEL_STACK_V36 */
          .map-weather,.hex .mist,.hex .fog-unknown{display:none!important;opacity:0!important;background:none!important;background-image:none!important}
          .hex:not(.seen){background:#000!important}
          .hex:not(.seen) .shade{background:#000!important;opacity:1!important}
          .hex:not(.seen) .mark{display:block!important;color:#d9b26a!important;text-shadow:0 0 8px rgba(217,178,106,.3),0 2px 5px #000!important}
          .poi-label-overlay{z-index:120!important;overflow:visible!important;pointer-events:none!important}
          .poi-label-float{z-index:121!important;pointer-events:none!important}
          CSS

      - name: Validate integrated production build
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html world.css world.js world-v5.css world-v5.js app-v6.css app-v6.js atlas-dark-poi.css atlas-poi-seed.js game-v7.css game-v7.js game-v8.css game-v8.js game-v9.css game-v9.js game-v10.css game-v10.js game-v11.css gemini-narrative-v11.js game-v12.css game-v12.js game-v13.css game-v13.js game-v14.css game-v14.js game-v15.css game-v15.js game-v16.css game-v16.js game-v17.css game-v17.js game-v18.css game-v18.js game-v19.css game-v19.js game-v20.css game-v20.js game-v21.css game-v21.js game-v22.css game-v22.js game-v23.css game-v23.js game-v24.css game-v24.js game-v25.css game-v25.js assets/ui-icons.svg; do test -s "$file"; done
          node --check world.js
          node --check world-v5.js
          node --check app-v6.js
          node --check atlas-poi-seed.js
          node --check game-v7.js
          node --check game-v8.js
          node --check game-v9.js
          node --check game-v10.js
          node --check gemini-narrative-v11.js
          node --check game-v12.js
          node --check game-v13.js
          node --check game-v14.js
          node --check game-v15.js
          node --check game-v16.js
          node --check game-v17.js
          node --check game-v18.js
          node --check game-v19.js
          node --check game-v20.js
          node --check game-v21.js
          node --check game-v22.js
          node --check game-v23.js
          node --check game-v24.js
          node --check game-v25.js
          grep -q 'game-v25.css?v=36' index.html
          grep -q 'game-v25.js?v=36' index.html
          grep -q 'game-v24.js?v=36' index.html
          grep -q 'gemini-narrative-v11.js?v=36' index.html
          grep -q 'ATLAS_LABEL_STACK_V36' atlas-dark-poi.css
          grep -q 'GAME_RUNTIME_V25' game-v25.js
          grep -q 'game25Talk' game-v25.js
          grep -q 'game25Reveal' game-v25.js
          grep -q 'game25PublicContext' game-v25.js
          grep -q 'game25HookGemini' game-v25.js
          grep -q 'GAME_RUNTIME_V24' game-v24.js
          grep -q 'GAME_RUNTIME_V23' game-v23.js
          ! grep -q "@import url('fog-v7.css" world-v5.css
          ! grep -q 'fog-boundary-v8.css' index.html
          ! grep -q 'fog-boundary-v8.js' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test public Pages site
        shell: bash
        run: |
          set -euo pipefail
          site='${{ steps.deployment.outputs.page_url }}'
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsSL --retry 2 "$site" -o /tmp/live-index.html && grep -q 'game-v25.js?v=36' /tmp/live-index.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          grep -q 'game-v25.css?v=36' /tmp/live-index.html
          curl -fsSL "${site}game-v25.js?v=36" -o /tmp/live-game25.js
          curl -fsSL "${site}game-v24.js?v=36" -o /tmp/live-game24.js
          curl -fsSL "${site}gemini-narrative-v11.js?v=36" -o /tmp/live-gemini11.js
          node --check /tmp/live-game25.js
          node --check /tmp/live-game24.js
          node --check /tmp/live-gemini11.js
          grep -q 'GAME_RUNTIME_V25' /tmp/live-game25.js
          grep -q 'game25Talk' /tmp/live-game25.js
          grep -q 'game25Reveal' /tmp/live-game25.js
          grep -q 'game25PublicContext' /tmp/live-game25.js
          grep -q 'GAME_RUNTIME_V24' /tmp/live-game24.js
          grep -q 'GEMINI_NARRATIVE_V11' /tmp/live-gemini11.js
          echo "PUBLIC_URL=$site"
