name: Deploy Braseiro WWN to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dark Atlas with visible POIs
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's/Hex-Crawl/Exploração Hex/g' index.html
          sed -i 's/Hexcrawl e exploração/Exploração por hex/g' index.html
          sed -i 's/Tempo \/ névoa/Tempo \/ clima/g' index.html

          # Force cache refresh for Atlas resources.
          sed -Ei 's/world-v5\.css\?v=[0-9]+/world-v5.css?v=14/g' index.html
          sed -Ei 's/world-v5\.js\?v=[0-9]+/world-v5.js?v=14/g' index.html

          # Permanently remove old fog import and fog runtime layer.
          sed -i "/@import url('fog-v7.css?v=1');/d" world-v5.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('world-v5.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("let wwnLayers=Object.assign({features:true,pois:true,mist:true,labels:true}", "let wwnLayers=Object.assign({features:true,pois:true,mist:false,labels:true}")
          s=s.replace("map.classList.toggle('hide-mist',!wwnLayers.mist);", "map.classList.add('hide-mist');")
          s=s.replace("<div class=\"layer mist\"></div>", "")
          s=s.replace("['mist','Neblina','Fog contextual de terreno e clima'],", "")
          s=s.replace("'Sem feature'", "'Sem relevo'")
          s=s.replace("<span>Feature</span>", "<span>Relevo</span>")
          s=s.replace("Terreno, feature ou local...", "Terreno, relevo ou local...")
          p.write_text(s,encoding='utf-8')
          PY

          # Inject the new dark palette and the visible POI pass after the main app resources.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'atlas-dark-poi.css' not in s:
              s=s.replace('</head>', '<link rel="stylesheet" href="atlas-dark-poi.css?v=14"></head>')
          if 'atlas-poi-seed.js' not in s:
              s=s.replace('</body>', '<script src="atlas-poi-seed.js?v=14"></script></body>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate Atlas production build
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html world.css world.js world-v5.css world-v5.js app-v6.css app-v6.js atlas-dark-poi.css atlas-poi-seed.js assets/ui-icons.svg; do test -s "$file"; done
          node --check world.js
          node --check world-v5.js
          node --check app-v6.js
          node --check atlas-poi-seed.js
          grep -q 'Exploração Hex' index.html
          grep -q 'atlas-dark-poi.css?v=14' index.html
          grep -q 'atlas-poi-seed.js?v=14' index.html
          grep -q 'ATLAS_DARK_POI_V14' atlas-dark-poi.css
          grep -q 'ATLAS_POI_SEED_V14' atlas-poi-seed.js
          grep -q "farmVillage" atlas-poi-seed.js
          grep -q "abandoned" atlas-poi-seed.js
          ! grep -q "@import url('fog-v7.css" world-v5.css
          ! grep -q 'fog-boundary-v8.css' index.html
          ! grep -q 'fog-boundary-v8.js' index.html
          test -s assets/poi_inhabited_02_farming_village.png
          test -s assets/poi_inhabited_16_crossroads_inn.png
          test -s assets/poi_inhabited_15_stone_bridge.png
          test -s assets/poi_dangerous_12_abandoned_settlement.png
          test -s assets/poi_inhabited_11_mine.png

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test public Pages site
        shell: bash
        run: |
          set -euo pipefail
          site='${{ steps.deployment.outputs.page_url }}'
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsSL --retry 2 "$site" -o /tmp/live-index.html && grep -q 'atlas-dark-poi.css?v=14' /tmp/live-index.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          grep -q 'atlas-poi-seed.js?v=14' /tmp/live-index.html
          curl -fsSL "${site}atlas-dark-poi.css?v=14" -o /tmp/live-dark.css
          curl -fsSL "${site}atlas-poi-seed.js?v=14" -o /tmp/live-poi.js
          node --check /tmp/live-poi.js
          grep -q 'ATLAS_DARK_POI_V14' /tmp/live-dark.css
          grep -q 'ATLAS_POI_SEED_V14' /tmp/live-poi.js
          for asset in assets/poi_inhabited_02_farming_village.png assets/poi_inhabited_16_crossroads_inn.png assets/poi_inhabited_15_stone_bridge.png assets/poi_dangerous_12_abandoned_settlement.png; do curl -fsSL "${site}${asset}" -o /tmp/check.bin; test -s /tmp/check.bin; done
          echo "PUBLIC_URL=$site"
