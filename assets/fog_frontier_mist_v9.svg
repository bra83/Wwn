<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="mist" x="-35%" y="-35%" width="170%" height="170%">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.024" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0 0 0 0 0.82
        0 0 0 0 0.86
        0 0 0 0 0.84
        0 0 0 1.15 -0.27" result="cloud"/>
      <feGaussianBlur in="cloud" stdDeviation="10" result="blur"/>
      <feComponentTransfer in="blur">
        <feFuncA type="gamma" amplitude="1.15" exponent="0.72" offset="0"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e6ebe8" stop-opacity="0.72"/>
      <stop offset="0.42" stop-color="#d8dfdc" stop-opacity="0.58"/>
      <stop offset="0.72" stop-color="#c8d1ce" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#c8d1ce" stop-opacity="0"/>
    </radialGradient>
    <mask id="softMask">
      <ellipse cx="256" cy="256" rx="246" ry="185" fill="url(#fade)"/>
    </mask>
  </defs>
  <g mask="url(#softMask)" filter="url(#mist)">
    <rect x="-40" y="40" width="592" height="432" fill="#e1e7e4" opacity="0.90"/>
  </g>
  <ellipse cx="180" cy="245" rx="155" ry="92" fill="url(#fade)" opacity="0.26"/>
  <ellipse cx="338" cy="275" rx="168" ry="96" fill="url(#fade)" opacity="0.22"/>
</svg>